[package]
name = "game-host"
version = "0.1.0"
edition = "2024"

[dependencies]
gamelib = { workspace = true }
gpu = { workspace = true, features = ["serde"] }
math = { workspace = true }
geom = { workspace = true }
color = { workspace = true }
log = "0.4.28"
hgeo = { workspace = true }
smallvec = "2.0.0-alpha.12"
serde = { version = "1", features = ["derive", "alloc", "rc"] }
ron = "0.12"
bytesize = "2.3.1"
rand = "0.9.2"
#usvg = { version = "0.47.0", default-features = false }
#libloading = "0.9.0"
#notify-debouncer-mini = "0.7.0"
thiserror = "2.0.18"
experiment = { workspace = true }
anyhow = "1.0.103"
shadertool = { workspace = true }
slang = { package = "shader-slang", git = "https://github.com/ennis/slang-rs.git", rev = "9959806aeaeed017ab7f9443eafc6149ecfeac28" }
pathdiff = "0.2.3"
spirv-reflect = { workspace = true }

[build-dependencies]
shadertool = { workspace = true }

[dev-dependencies]
rayon = "1.11.0"

[features]
hot_reload = ["gamelib/hot_reload"]
tracy = ["gamelib/tracy"]
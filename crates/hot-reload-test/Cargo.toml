[package]
name = "hot-reload-test"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
gamelib = { workspace = true }
gpu = { workspace = true }
math = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
humantime = "2.4.0"
planitia-workspace-hack = { version = "0.1", path = "../../planitia-workspace-hack" }

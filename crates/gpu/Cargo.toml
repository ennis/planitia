[package]
name = "gpu"
version = "0.1.0"
authors = ["Alexandre Bléron <alex.bleron@gmail.com>"]
edition = "2024"

[dependencies]
ash = "0.38"
vulkan-headers = "0.2.4" # until ash updates to support vk1.4
bitflags = "2"
gpu-allocator = "0.28"
raw-window-handle = "0.6.0"
slotmap = "1"
log = "0.4.27"
thiserror = "2"
gpu-macros = { workspace = true }
math = { workspace = true }
color = { workspace = true, optional = true }

[dependencies.winapi]
version = "0.3.9"
optional = true
features = [
    "dcommon",
    "d3d11",
    "dxgi",
    "dxgi1_2",
    "dxgi1_3",
    "dxgiformat",
    "dxgitype",
    "wtypesbase"]

[dev-dependencies]
winit = "0.30"
image = "0.25.6"

[features]
default = ["color"]
graal-windows = ["winapi"]
# Enables integration with the color crate, so that color types are recognized as valid VertexAttribute types
color = ["dep:color"]
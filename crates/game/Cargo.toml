[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
gamelib = { workspace = true }
gpu = { workspace = true }
math = { workspace = true }
geom = { workspace = true }
color = { workspace = true }
log = "0.4.28"
hgeo = { workspace = true }
smallvec = "2.0.0-alpha.12"
serde = { version = "1", features = ["derive", "alloc", "rc"] }
ron = "0.12"
bytesize = "2.3.1"
rand = "0.9.2"
usvg = { version = "0.47.0", default-features = false }
libloading = "0.9.0"
notify-debouncer-mini = "0.7.0"
tracy-client = "0.18.4"
thiserror = "2.0.18"
planitia-workspace-hack = { version = "0.1", path = "../../planitia-workspace-hack" }

[build-dependencies]
shadertool = { workspace = true }

[dev-dependencies]
rayon = "1.11.0"

[features]
hot_reload = ["gamelib/hot_reload"]

[package]
name = "color"
version = "0.1.0"
edition = "2024"

[dependencies]
math = { workspace = true }
serde = { version = "1", features = ["derive", "alloc", "rc"], optional = true }
planitia-workspace-hack = { version = "0.1", path = "../../planitia-workspace-hack" }

[features]
default = ["serialization"]
serialization = ["dep:serde"]
